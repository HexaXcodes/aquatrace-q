services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: aquatrace
      POSTGRES_PASSWORD: aquatrace
      POSTGRES_DB: aquatrace
    ports:
      - "5432:5432"
    volumes:
      - aquatrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquatrace -d aquatrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://aquatrace:aquatrace@db:5432/aquatrace
      ENV: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./models:/app/models
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  aquatrace_pgdata:
